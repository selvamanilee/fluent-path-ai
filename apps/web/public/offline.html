<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline — FluentPath AI</title>
<style>
  :root { color-scheme: light dark; --bg:#E7E4F0; --fg:#141414; --muted:#5d5a6e; --accent:#6E62E5; --card:#fff }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0d; --fg:#f4f2fb; --muted:#a9a5bd; --card:#1c1c1f } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font-family: Outfit, system-ui, sans-serif; padding: 16px; }
  .card { background:var(--card); border-radius:28px; padding:32px 24px; max-width:420px; text-align:center }
  h1 { margin:0 0 8px; font-size:28px } p { color:var(--muted); line-height:1.5 }
  button { margin-top:16px; background:var(--accent); color:#fff; border:0; border-radius:999px; padding:14px 28px; font:600 16px inherit; min-height:48px }
</style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>Lessons, vocabulary and reading you opened before are still available in the app. Your answers need a connection to be checked and saved.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
