<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FluentPath AI — English Communication Coach</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="FluentPath AI — Learn. Practice. Speak. Improve. Your personal English communication coach." />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#E7E4F0" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <!-- iOS Safari / Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FluentPath" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96x96.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try { var t = localStorage.getItem('fp-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
  </head>
  <body>
    <app-root>
      <div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui;color:#8a86a3">Loading FluentPath…</div>
    </app-root>
    <noscript>Please enable JavaScript to use FluentPath AI.</noscript>
  </body>
</html>
