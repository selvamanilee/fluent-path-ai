# Local full stack: docker compose up --build   →   http://localhost:4200
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: fluentpath, POSTGRES_PASSWORD: fluentpath, POSTGRES_DB: fluentpath }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fluentpath"], interval: 5s, retries: 10 }
  agent:
    build: ./services/agent
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?set AGENT_SERVICE_TOKEN}
    extra_hosts: ["host.docker.internal:host-gateway"]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://fluentpath:fluentpath@db:5432/fluentpath
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars)}
      AGENT_URL: http://agent:8000
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN}
  web:
    build: { context: ./apps/web }
    depends_on: [api]
    environment: { API_URL: http://api:3000 }
    ports: ["4200:4200"]
volumes: { pgdata: {} }
